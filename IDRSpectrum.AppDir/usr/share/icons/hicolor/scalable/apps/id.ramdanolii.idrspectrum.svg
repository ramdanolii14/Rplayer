<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0f10"/>
      <stop offset="100%" style="stop-color:#141618"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#024724"/>
      <stop offset="100%" style="stop-color:#20ff50"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#024724"/>
      <stop offset="100%" style="stop-color:#0dba59"/>
    </linearGradient>
  </defs>
  <!-- BG -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- outer ring -->
  <rect x="2" y="2" width="124" height="124" rx="27" fill="none" stroke="#1f2226" stroke-width="2"/>
  
  <!-- Spectrum bars (centered group) -->
  <!-- bar heights represent a music waveform -->
  <g transform="translate(12, 8)">
    <!-- bar 1 -->
    <rect x="0"  y="72" width="10" height="28" rx="2" fill="url(#bar1)" opacity="0.7"/>
    <!-- bar 2 -->
    <rect x="14" y="52" width="10" height="48" rx="2" fill="url(#bar1)" opacity="0.85"/>
    <!-- bar 3 -->
    <rect x="28" y="30" width="10" height="70" rx="2" fill="url(#bar1)"/>
    <!-- bar 4 (tallest) -->
    <rect x="42" y="14" width="10" height="86" rx="2" fill="url(#bar1)"/>
    <!-- bar 5 -->
    <rect x="56" y="28" width="10" height="72" rx="2" fill="url(#bar1)"/>
    <!-- bar 6 -->
    <rect x="70" y="44" width="10" height="56" rx="2" fill="url(#bar2)" opacity="0.85"/>
    <!-- bar 7 -->
    <rect x="84" y="60" width="10" height="40" rx="2" fill="url(#bar2)" opacity="0.7"/>
    <!-- bar 8 -->
    <rect x="98" y="68" width="10" height="32" rx="2" fill="url(#bar2)" opacity="0.55"/>
  </g>

  <!-- IDR text tag bottom -->
  <text x="64" y="118" font-family="monospace" font-size="11" font-weight="700"
        fill="#3a3e48" text-anchor="middle" letter-spacing="3">IDR</text>
</svg>